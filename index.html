<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA 26 World Cup Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#060c06;color:#ddeedd;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;font-size:14px}

/* HEADER */
.hdr{background:linear-gradient(155deg,#112211 0%,#1d5a1d 45%,#112211 100%);padding:26px 20px 20px;text-align:center;border-bottom:3px solid #c8a800}
.hdr h1{font-size:1.9rem;font-weight:900;color:#ffd700;text-transform:uppercase;letter-spacing:3px}
.hdr p{color:#7ab87a;margin-top:5px;font-size:.87rem;letter-spacing:.5px}

/* TABS */
.tabs{display:flex;background:#070d07;border-bottom:2px solid #172a17;position:sticky;top:0;z-index:99}
.tab{flex:1;padding:13px 4px;text-align:center;cursor:pointer;font-size:.75rem;font-weight:700;color:#4a7a4a;border-bottom:3px solid transparent;text-transform:uppercase;letter-spacing:.8px;transition:color .15s,background .15s;user-select:none}
.tab:hover{color:#c8a800;background:#0c130c}
.tab.on{color:#ffd700;border-bottom-color:#ffd700;background:#0c130c}

/* PAGES */
.page{display:none}
.page.on{display:block}
main{max-width:1140px;margin:0 auto;padding:20px 14px 80px}

/* PAGE TITLE */
.ptitle{font-size:1.25rem;font-weight:800;color:#ffd700;margin-bottom:18px;padding-bottom:8px;border-bottom:1px solid #1a301a}

/* CARD */
.card{background:#0c170c;border:1px solid #1a301a;border-radius:10px;padding:16px;margin-bottom:13px}
.chd{display:flex;align-items:center;gap:9px;font-weight:700;color:#5dc45d;font-size:.92rem;margin-bottom:14px}

/* FIELDS */
.f{margin-bottom:10px}
.f label{display:block;font-size:.68rem;font-weight:700;color:#508a50;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
input[type=text],input[type=number]{background:#080e08;border:1.5px solid #1c321c;border-radius:6px;color:#ddeedd;padding:8px 10px;font-size:.87rem;width:100%;transition:border-color .2s}
input[type=text]:focus,input[type=number]:focus{outline:none;border-color:#3a7a3a}
input::placeholder{color:#283c28}
input[type=number]{width:56px;text-align:center;padding:8px 4px}

/* GRIDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(325px,1fr));gap:14px}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(355px,1fr));gap:14px}
.ko-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px}

/* DIVIDER */
hr.d{border:none;border-top:1px solid #182818;margin:11px 0}

/* PLAYER NUMBER */
.pnum{width:25px;height:25px;background:linear-gradient(135deg,#256625,#338833);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:#fff;flex-shrink:0}

/* PRED GRID */
.pred-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* MATCH ROW */
.mrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #141e14}
.mrow:last-child{border-bottom:none}
.mteam{flex:1;font-size:.8rem;color:#a8c8a8;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mteam.r{text-align:right}
.mscore{display:flex;align-items:center;gap:3px;flex-shrink:0}
.sep{color:#305030;font-weight:700}

/* BRACKET */
.round-hd{font-size:.92rem;font-weight:700;color:#5dc45d;padding:7px 12px;background:#0b160b;border-left:3px solid #387838;border-radius:0 6px 6px 0;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.chip{background:#132213;border:1px solid #224422;border-radius:10px;padding:2px 8px;font-size:.68rem;color:#5ab45a;font-weight:600}
.bmatch{background:#0c170c;border:1px solid #1a301a;border-radius:8px;padding:12px}
.blbl{font-size:.66rem;color:#356035;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px}
.brow{display:flex;align-items:center;gap:8px;padding:2px 0}
.bteam{flex:1}
.bscore{width:50px;flex-shrink:0}

/* BADGE */
.badge{display:inline-block;background:#132213;border:1px solid #224422;border-radius:4px;padding:2px 7px;font-size:.72rem;color:#68b868;font-weight:600}

/* LEADERBOARD */
.lb-wrap{}
.lb-item{background:#0c170c;border:1px solid #1a301a;border-radius:10px;margin-bottom:12px;overflow:hidden}
.lb-item.r1{border-color:#c8a800;box-shadow:0 0 14px #c8a80028}
.lb-item.r2{border-color:#909090}
.lb-item.r3{border-color:#a06820}
.lb-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lb-rank{font-size:1.5rem;width:38px;text-align:center;flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:1rem;font-weight:700}
.lb-teams{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.lb-bk{font-size:.7rem;color:#3e6e3e;margin-top:4px}
.lb-pts-wrap{text-align:right;flex-shrink:0}
.lb-pts{font-size:1.6rem;font-weight:900;color:#ffd700;line-height:1}
.lb-pts-lbl{font-size:.65rem;color:#3a6a3a}
.lb-preds{padding:10px 16px 13px;border-top:1px solid #141e14;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc{font-size:.74rem}
.pclbl{color:#366636;font-weight:700;margin-bottom:2px}
.pcval{color:#a8c8a8}
.pcval.empty{color:#253525}

/* VIEW ONLY BANNER */
.view-banner{display:none;background:#3a2a00;border-bottom:2px solid #c8a800;padding:7px 16px;font-size:.78rem;font-weight:700;color:#ffe070;text-align:center;letter-spacing:.5px}
body.view-mode .view-banner{display:block}
body.view-mode input{pointer-events:none;color:#6a8a6a !important;background:transparent !important;border-color:#131e13 !important}
body.view-mode .bar{display:none}

/* BOTTOM BAR */
.bar{position:fixed;bottom:0;left:0;right:0;background:#070d07;border-top:1px solid #17271a;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;z-index:199}
.bar-txt{font-size:.76rem;color:#325532}
.bar-txt.ok{color:#44aa44}
.bar-txt.warn{color:#c8a800}
.bar-btns{display:flex;gap:8px;align-items:center}
.btn{background:#1a4e1a;color:#cceacc;border:1px solid #267226;border-radius:6px;padding:8px 15px;font-size:.8rem;font-weight:700;cursor:pointer;transition:background .15s}
.btn:hover{background:#226622}
.btn-gold{background:#6a5200;border-color:#c8a800;color:#ffe070}
.btn-gold:hover{background:#8a6800}
.btn-red{background:#4a0e0e;border-color:#882222;color:#ffaaaa;font-size:.73rem;padding:7px 12px}
.btn-red:hover{background:#621414}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 20px;color:#2e4e2e;font-size:.95rem}

/* STANDINGS TABLE */
.standings{width:100%;border-collapse:collapse;font-size:.76rem}
.standings th{color:#3a6a3a;font-weight:700;text-align:center;padding:4px 4px;border-bottom:1px solid #182818;text-transform:uppercase;font-size:.62rem;letter-spacing:.3px}
.standings th.tname{text-align:left;padding-left:6px}
.standings td{padding:4px 4px;text-align:center;border-bottom:1px solid #0e180e;color:#5a7a5a}
.standings td.tname{text-align:left;padding-left:6px;color:#8aaa8a;font-weight:600}
.standings td.pos{width:14px;color:#2e4e2e;font-weight:700}
.standings tr:last-child td{border-bottom:none}
.standings tr.q td{color:#a8c8a8}
.standings tr.q td.pos{color:#4dc44d}
.standings tr.q td.tname{color:#c0e0c0;font-weight:700}
.standings tr.q td strong{color:#7adc7a}
.standings tr.q-last td{border-bottom:1px dashed #2a4a2a}

/* FIXTURES */
.md-wrap{margin-top:12px}
.md-lbl{font-size:.64rem;color:#2e5e2e;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px;padding-left:2px}
.fix-row{display:flex;align-items:center;gap:5px;padding:6px 8px;background:#090f09;border:1px solid #111c11;border-radius:5px;margin-bottom:3px}
.fx-home{flex:1;font-size:.8rem;font-weight:600;color:#6a8a6a;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.fx-away{flex:1;font-size:.8rem;font-weight:600;color:#6a8a6a;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.fx-mid{display:flex;align-items:center;gap:3px;flex-shrink:0}
.fx-home.win,.fx-away.win{color:#c8e8c8}
.fx-home.loss,.fx-away.loss{color:#2e4a2e}

@media(max-width:580px){
  .hdr h1{font-size:1.3rem;letter-spacing:1px}
  .g2,.g4,.pred-grid{grid-template-columns:1fr}
  .lb-preds{grid-template-columns:1fr 1fr}
  .groups-grid,.players-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="view-banner">👁 VIEW ONLY — contact the admin to make changes</div>
<div class="hdr">
  <h1>⚽ FIFA 26 World Cup Tracker</h1>
  <p>Predict &bull; Track &bull; Dominate your group</p>
</div>

<nav class="tabs">
  <div class="tab on"   onclick="go('players')">Players</div>
  <div class="tab"      onclick="go('groups')">Groups</div>
  <div class="tab"      onclick="go('bracket')">Bracket</div>
  <div class="tab"      onclick="go('leaderboard')">Leaderboard</div>
</nav>

<main>
  <div id="pg-players"     class="page on"></div>
  <div id="pg-groups"      class="page"></div>
  <div id="pg-bracket"     class="page"></div>
  <div id="pg-leaderboard" class="page"></div>
</main>

<div class="bar">
  <div class="bar-txt" id="bar-txt"></div>
  <div class="bar-btns" id="bar-btns">
    <button class="btn btn-red" onclick="resetAll()">Reset All</button>
    <button class="btn btn-gold" onclick="go('leaderboard')">🏆 Scores</button>
  </div>
</div>

<script>
'use strict';

// ─── CONSTANTS ────────────────────────────────────────────────────────────────

const GROUPS = 'ABCDEFGHIJKL'.split('');

// All 6 round-robin matchups in a 4-team group (indices into teams[])
const MPAIRS = [[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
// Match indices grouped by matchday
const MATCHDAYS = [[0,1],[2,3],[4,5]];

const ROUNDS = [
  {key:'r32',  label:'Round of 32',    n:16, pts:5 },
  {key:'r16',  label:'Round of 16',    n:8,  pts:5 },
  {key:'qf',   label:'Quarter-Finals', n:4,  pts:10},
  {key:'sf',   label:'Semi-Finals',    n:2,  pts:15},
  {key:'final',label:'Final',          n:1,  pts:25},
];

const PREDS = [
  {key:'winner',     label:'🏆 Winner'},
  {key:'topScorer',  label:'⚽ Top Scorer'},
  {key:'topAssist',  label:'🎯 Top Assister'},
  {key:'bestPlayer', label:'⭐ Best Player'},
  {key:'darkHorse',  label:'🐴 Dark Horse'},
  {key:'goldenGlove',label:'🧤 Golden Glove'},
  {key:'flopNation', label:'💩 Flop Nation'},
  {key:'totalGoals', label:'📊 Total Goals'},
];

// ─── DATA SCHEMA ──────────────────────────────────────────────────────────────

const mkMatch = () => ({h:'', a:'', hs:'', as:''});

function fresh() {
  return {
    players: Array.from({length:6}, () => ({
      name: '',
      teams: ['','',''],
      p: Object.fromEntries(PREDS.map(f => [f.key,''])),
    })),
    groups: Object.fromEntries(GROUPS.map(g => [g, {
      teams: ['','','',''],
      matches: MPAIRS.map(([h,a]) => ({h, a, hs:'', as:''})),
    }])),
    ko: {
      r32:   Array.from({length:16}, mkMatch),
      r16:   Array.from({length:8},  mkMatch),
      qf:    Array.from({length:4},  mkMatch),
      sf:    Array.from({length:2},  mkMatch),
      final: Array.from({length:1},  mkMatch),
      champion: '',
    },
  };
}

// ─── CONFIG (set by setup.py) ─────────────────────────────────────────────────
const BIN_ID = 'f0b7553b1c8aa3465e6a522f9e05cbab'; // set by setup.py

// ─── PERSISTENCE (GitHub Gist) ────────────────────────────────────────────────

const EDIT_TOKEN = new URLSearchParams(location.search).get('token') || '';
const IS_EDIT    = !!EDIT_TOKEN || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const GIST_API   = `https://api.github.com/gists/${BIN_ID}`;
const LS_KEY     = `wc26_${BIN_ID}`;
const SESS_KEY   = `wc26_sess_${BIN_ID}`;

// ─── DEFAULT DATA (hardcoded so it's always there) ───────────────────────────
const DEFAULT_DATA = {
  players: [
    { name: 'Callum', teams: ['', '', ''], p: {
      winner: 'France', topScorer: 'Mbappe', topAssist: 'Olise',
      bestPlayer: 'Mbappe', darkHorse: 'Senegal', goldenGlove: 'Unai Simon',
      flopNation: 'Argentina', totalGoals: '258'
    }},
    { name: '', teams: ['', '', ''], p: { winner:'', topScorer:'', topAssist:'', bestPlayer:'', darkHorse:'', goldenGlove:'', flopNation:'', totalGoals:'' }},
    { name: '', teams: ['', '', ''], p: { winner:'', topScorer:'', topAssist:'', bestPlayer:'', darkHorse:'', goldenGlove:'', flopNation:'', totalGoals:'' }},
    { name: '', teams: ['', '', ''], p: { winner:'', topScorer:'', topAssist:'', bestPlayer:'', darkHorse:'', goldenGlove:'', flopNation:'', totalGoals:'' }},
    { name: '', teams: ['', '', ''], p: { winner:'', topScorer:'', topAssist:'', bestPlayer:'', darkHorse:'', goldenGlove:'', flopNation:'', totalGoals:'' }},
    { name: '', teams: ['', '', ''], p: { winner:'', topScorer:'', topAssist:'', bestPlayer:'', darkHorse:'', goldenGlove:'', flopNation:'', totalGoals:'' }},
  ],
  groups: {
    A: { teams: ['Mexico','South Africa','South Korea (Korea Republic)','Czechia (Czech Republic)'], matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
    B: { teams: ['Canada','Switzerland','Qatar','Bosnia & Herzegovina'],                              matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
    C: { teams: ['Brazil','Morocco','Haiti','Scotland'],                                              matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
    D: { teams: ['United States','Paraguay','Australia','Türkiye (Turkey)'],                          matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
    E: { teams: ['Germany','Curaçao','Ivory Coast (Côte d\'Ivoire)','Ecuador'],                       matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
    F: { teams: ['Netherlands','Japan','Tunisia','Sweden'],                                           matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
    G: { teams: ['Belgium','Egypt','Iran (IR Iran)','New Zealand'],                                   matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
    H: { teams: ['Spain','Cape Verde (Cabo Verde)','Saudi Arabia','Uruguay'],                         matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
    I: { teams: ['France','Senegal','Norway','Iraq'],                                                 matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
    J: { teams: ['Argentina','Algeria','Austria','Jordan'],                                           matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
    K: { teams: ['Portugal','Uzbekistan','Colombia','DR Congo (Congo DR)'],                           matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
    L: { teams: ['England','Croatia','Ghana','Panama'],                                               matches: MPAIRS.map(([h,a])=>({h,a,hs:'',as:''})) },
  },
  ko: {
    r32:   Array.from({length:16}, mkMatch),
    r16:   Array.from({length:8},  mkMatch),
    qf:    Array.from({length:4},  mkMatch),
    sf:    Array.from({length:2},  mkMatch),
    final: Array.from({length:1},  mkMatch),
    champion: '',
  },
};

let D = JSON.parse(JSON.stringify(DEFAULT_DATA)); // deep clone so defaults are never mutated

async function loadFromServer() {
  if (BIN_ID === '__BIN_ID__') { showSetupWarning(); return; }
  // Edit mode: localStorage first (instant, no network round-trip)
  if (EDIT_TOKEN || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const j = JSON.parse(raw); if (j?.players) { D = j; return; } }
    } catch(_){}
  }
  // Always fetch fresh from Gist — view-mode never uses stale sessionStorage
  try {
    const headers = {'Accept':'application/vnd.github+json'};
    if (EDIT_TOKEN) headers['Authorization'] = `Bearer ${EDIT_TOKEN}`;
    const res = await fetch(GIST_API, {headers});
    if (res.ok) {
      const gist = await res.json();
      const raw  = gist.files?.['data.json']?.content;
      if (raw) {
        const j = JSON.parse(raw);
        if (j?.players) {
          D = j;
          try { localStorage.setItem(LS_KEY, raw); } catch(_){}
          return;
        }
      }
    }
  } catch(_){}
  // Nothing from server — keep hardcoded defaults already in D
}

function showSetupWarning() {
  // overlay — never touch main's children so buildAll() still works
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;background:#060c06;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center';
  el.innerHTML = `
    <div style="font-size:2.5rem">⚙️</div>
    <div style="font-size:1.1rem;font-weight:700;color:#c8a800">App not configured yet</div>
    <div style="color:#5a8a5a;font-size:.88rem;max-width:340px">
      Run <code style="background:#0c170c;padding:2px 7px;border-radius:4px;color:#7abe7a">python3 setup.py</code>
      to connect cloud storage, then redeploy.
    </div>`;
  document.body.appendChild(el);
}

// Save: localStorage immediately (always), then background Gist sync if we have a token
function save() {
  if (!IS_EDIT) return; // view mode — never mutate data
  try { localStorage.setItem(LS_KEY, JSON.stringify(D)); } catch(_){}
  try { sessionStorage.setItem(SESS_KEY, JSON.stringify(D)); } catch(_){}
  flash('✓ Saved', false);
  if (!EDIT_TOKEN) return; // localhost with no token — localStorage only, no cloud sync
  clearTimeout(save._cloud);
  save._cloud = setTimeout(async () => {
    const btn = document.getElementById('sync-btn');
    if (btn) { btn.textContent = '↑ Syncing…'; btn.disabled = true; }
    try {
      const res = await fetch(GIST_API, {
        method: 'PATCH',
        headers: {
          'Content-Type':'application/json',
          'Accept':'application/vnd.github+json',
          'Authorization':`Bearer ${EDIT_TOKEN}`,
          'X-GitHub-Api-Version':'2022-11-28',
        },
        body: JSON.stringify({files:{'data.json':{content:JSON.stringify(D)}}}),
      });
      if (btn) { btn.textContent = res.ok ? '✓ Synced' : '↑ Sync cloud'; btn.disabled = false; }
    } catch(_) { if (btn) { btn.textContent = '↑ Sync cloud'; btn.disabled = false; } }
    setTimeout(() => { if (btn && btn.textContent === '✓ Synced') btn.textContent = '↑ Sync cloud'; }, 3000);
  }, 1500);
}

async function syncNow() {
  if (!IS_EDIT) return;
  const btn = document.getElementById('sync-btn');
  if (btn) { btn.textContent = '↑ Syncing…'; btn.disabled = true; }
  try {
    const res = await fetch(GIST_API, {
      method: 'PATCH',
      headers: {
        'Content-Type':'application/json',
        'Accept':'application/vnd.github+json',
        'Authorization':`Bearer ${EDIT_TOKEN}`,
        'X-GitHub-Api-Version':'2022-11-28',
      },
      body: JSON.stringify({files:{'data.json':{content:JSON.stringify(D)}}}),
    });
    flash(res.ok ? '✓ Synced to cloud' : '⚠ Cloud unavailable — data saved locally', !res.ok);
  } catch(_) { flash('✓ Saved locally — no cloud connection', false); }
  if (btn) { btn.textContent = '↑ Sync cloud'; btn.disabled = false; }
}

function flash(msg, err) {
  const el = document.getElementById('bar-txt');
  if (!el) return;
  el.textContent = msg;
  el.className = 'bar-txt' + (err ? ' warn' : ' ok');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { el.textContent = ''; el.className = 'bar-txt'; }, 3500);
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────

const TAB_NAMES = ['players','groups','bracket','leaderboard'];

function go(name) {
  document.querySelectorAll('.tab').forEach((el,i) =>
    el.classList.toggle('on', TAB_NAMES[i] === name));
  document.querySelectorAll('.page').forEach(el => el.classList.remove('on'));
  const pg = document.getElementById('pg-'+name);
  if (!pg) return;
  pg.classList.add('on');
  if (name === 'leaderboard') buildLeaderboard();
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────

// HTML-escape
function h(v) {
  return String(v??'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Normalise team name for comparison
const norm = s => String(s||'').trim().toLowerCase();

// ─── PLAYERS PAGE ─────────────────────────────────────────────────────────────

function buildPlayers() {
  const el = document.getElementById('pg-players');
  if (!el) return;
  el.innerHTML = `
    <div class="ptitle">Player Setup</div>
    <div class="players-grid">${D.players.map((p,i) => playerCard(p,i)).join('')}</div>`;
}

function playerCard(p, i) {
  return `
  <div class="card">
    <div class="chd"><div class="pnum">${i+1}</div>Player ${i+1}</div>

    <div class="f">
      <label>Name</label>
      <input type="text" value="${h(p.name)}" placeholder="Enter name"

function renderStandings(g) {
  const grp = D.groups[g];
  const stats = grp.teams.map((name, ti) => ({name, ti, w:0, d:0, l:0, gf:0, ga:0}));

  for (const m of grp.matches) {
    if (m.hs===''||m.hs==null||m.as===''||m.as==null) continue;
    const hs = +m.hs, as = +m.as;
    stats[m.h].gf += hs; stats[m.h].ga += as;
    stats[m.a].gf += as; stats[m.a].ga += hs;
    if (hs > as)      { stats[m.h].w++; stats[m.a].l++; }
    else if (hs < as) { stats[m.a].w++; stats[m.h].l++; }
    else              { stats[m.h].d++; stats[m.a].d++; }
  }

  const sorted = stats
    .filter(s => s.name.trim())
    .map(s => ({...s, pts: s.w*3+s.d, gd: s.gf-s.ga, pl: s.w+s.d+s.l}))
    .sort((a,b) => b.pts-a.pts || b.gd-a.gd || b.gf-a.gf);

  if (!sorted.length) return `<p style="color:#1e3e1e;font-size:.75rem;padding:4px 0">Enter team names to see standings</p>`;

  return `
  <table class="standings">
    <thead><tr>
      <th class="pos">#</th><th class="tname">Team</th>
      <th>P</th><th>W</th><th>D</th><th>L</th>
      <th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
    </tr></thead>
    <tbody>
      ${sorted.map((s, pos) => {
        const qualifies = pos < 2;
        const isLastQ   = pos === 1 && sorted.length > 2;
        return `
        <tr class="${qualifies?'q':''}${isLastQ?' q-last':''}">
          <td class="pos">${pos+1}</td>
          <td class="tname">${h(s.name)}</td>
          <td>${s.pl}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td>
          <td>${s.gf}</td><td>${s.ga}</td>
          <td>${s.gd>0?'+':''}${s.gd}</td>
          <td><strong>${s.pts}</strong></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}

// ─── KO PROPAGATION ──────────────────────────────────────────────────────────

// Returns 'h', 'a', or null. Scores like "1E" mean that side won on penalties.
function getKOWinner(m) {
  const hs = String(m.hs ?? ''), as = String(m.as ?? '');
  if (!hs && !as) return null;
  if (/[Ee]/.test(hs)) return 'h';
  if (/[Ee]/.test(as)) return 'a';
  const hg = parseInt(hs), ag = parseInt(as);
  if (isNaN(hg) || isNaN(ag)) return null;
  if (hg > ag) return 'h';
  if (ag > hg) return 'a';
  return null;
}

// Derive all subsequent rounds from current scores, in-place on D.ko.
function propagateKO() {
  const chain = [
    {from:'r32', to:'r16'},
    {from:'r16', to:'qf'},
    {from:'qf',  to:'sf'},
    {from:'sf',  to:'final'},
  ];
  for (const {from, to} of chain) {
    const src = D.ko[from];
    const dst = D.ko[to];
    for (let i = 0; i < src.length; i++) {
      const w = getKOWinner(src[i]);
      const team = w === 'h' ? src[i].h : w === 'a' ? src[i].a : '';
      const dstIdx = Math.floor(i / 2);
      const slot   = i % 2 === 0 ? 'h' : 'a';
      dst[dstIdx][slot] = team;
    }
  }
}

// Called on every score keypress: propagate then update team-name inputs in later rounds.
function onKOScore(rk, mi) {
  save();
  propagateKO();
  const nextRound = {r32:'r16', r16:'qf', qf:'sf', sf:'final'};
  let cur = rk;
  while (nextRound[cur]) {
    const nr = nextRound[cur];
    D.ko[nr].forEach((m, i) => {
      const hEl = document.getElementById(`ko-${nr}-${i}-h`);
      const aEl = document.getElementById(`ko-${nr}-${i}-a`);
      if (hEl && hEl !== document.activeElement) hEl.value = m.h || '';
      if (aEl && aEl !== document.activeElement) aEl.value = m.a || '';
    });
    cur = nr;
  }
}

// ─── BRACKET SEEDING ─────────────────────────────────────────────────────────

function computeGroupStandings(g) {
  const grp = D.groups[g];
  const stats = grp.teams.map((name, ti) => ({name, ti, w:0, d:0, l:0, gf:0, ga:0}));
  for (const m of grp.matches) {
    if (m.hs===''||m.hs==null||m.as===''||m.as==null) continue;
    const hs = +m.hs, as = +m.as;
    stats[m.h].gf += hs; stats[m.h].ga += as;
    stats[m.a].gf += as; stats[m.a].ga += hs;
    if (hs > as)      { stats[m.h].w++; stats[m.a].l++; }
    else if (hs < as) { stats[m.a].w++; stats[m.h].l++; }
    else              { stats[m.h].d++; stats[m.a].d++; }
  }
  return stats
    .filter(s => s.name.trim())
    .map(s => ({...s, pts: s.w*3+s.d, gd: s.gf-s.ga}))
    .sort((a,b) => b.pts-a.pts || b.gd-a.gd || b.gf-a.gf);
}

function seedBracket() {
  if (!IS_EDIT) return;

  const std = {};
  for (const g of GROUPS) std[g] = computeGroupStandings(g);

  const w = g => std[g][0]?.name || '';
  const r = g => std[g][1]?.name || '';

  // Collect 3rd-place teams from all 12 groups, ranked by pts → GD → GF
  const thirds = GROUPS
    .map(g => std[g][2] ? {...std[g][2], group: g} : null)
    .filter(Boolean)
    .sort((a,b) => b.pts-a.pts || b.gd-a.gd || b.gf-a.gf);
  const top8 = thirds.slice(0, 8);

  // Eligible groups for each of the 8 third-place bracket slots (matches 74,77,79,80,81,82,85,87)
  const thirdSlotGroups = ['ABCDF','CDFGH','CEFHI','EHIJK','BEFIJ','AEHIJ','EFGIJ','DEIJL'];
  const assignedThird   = new Array(8).fill('');
  const pool    = [...top8];
  const pending = new Set([0,1,2,3,4,5,6,7]);

  // Most-constrained-first greedy assignment
  while (pending.size > 0) {
    let pick = -1, minCount = Infinity;
    for (const i of pending) {
      const c = pool.filter(t => thirdSlotGroups[i].includes(t.group)).length;
      if (c < minCount) { minCount = c; pick = i; }
    }
    const eligible = pool.filter(t => thirdSlotGroups[pick].includes(t.group));
    if (eligible.length) {
      assignedThird[pick] = eligible[0].name;
      pool.splice(pool.indexOf(eligible[0]), 1);
    }
    pending.delete(pick);
  }

  const t = i => assignedThird[i];

  // R32 seeding — matches 73–88 mapped to r32 indices 0–15
  const seeding = [
    { h: r('A'), a: r('B') }, // 73: A 2nd vs B 2nd
    { h: w('E'), a: t(0)   }, // 74: E 1st (Germany) vs A/B/C/D/F 3rd
    { h: w('F'), a: r('C') }, // 75: F 1st vs C 2nd
    { h: w('C'), a: r('F') }, // 76: C 1st vs F 2nd
    { h: w('I'), a: t(1)   }, // 77: I 1st vs C/D/F/G/H 3rd
    { h: r('E'), a: r('I') }, // 78: E 2nd vs I 2nd
    { h: w('A'), a: t(2)   }, // 79: A 1st (Mexico) vs C/E/F/H/I 3rd
    { h: w('L'), a: t(3)   }, // 80: L 1st vs E/H/I/J/K 3rd
    { h: w('D'), a: t(4)   }, // 81: D 1st (USA) vs B/E/F/I/J 3rd
    { h: w('G'), a: t(5)   }, // 82: G 1st vs A/E/H/I/J 3rd
    { h: r('K'), a: r('L') }, // 83: K 2nd vs L 2nd
    { h: w('H'), a: r('J') }, // 84: H 1st vs J 2nd
    { h: w('B'), a: t(6)   }, // 85: B 1st vs E/F/G/I/J 3rd
    { h: w('J'), a: r('H') }, // 86: J 1st (Argentina) vs H 2nd
    { h: w('K'), a: t(7)   }, // 87: K 1st vs D/E/I/J/L 3rd
    { h: r('D'), a: r('G') }, // 88: D 2nd vs G 2nd
  ];

  // Only update team names — preserve any scores already entered
  seeding.forEach((s, i) => {
    D.ko.r32[i].h = s.h;
    D.ko.r32[i].a = s.a;
  });

  propagateKO(); // re-derive R16/QF/SF/Final from existing R32 scores
  save();
  buildBracket();
  flash('✓ R32 bracket seeded from group results', false);
}

// ─── POINTS CALCULATION ───────────────────────────────────────────────────────

// Fuzzy team name match: handles short names vs. full names with parenthetical alternates
function teamMatch(a, b) {
  if (!a || !b) return false;
  if (a === b) return true;
  return a.includes(b) || b.includes(a);
}

function teamsInRound(rk) {
  const s = new Set();
  for (const m of (D.ko[rk]||[])) {
    if (norm(m.h)) s.add(norm(m.h));
    if (norm(m.a)) s.add(norm(m.a));
  }
  return s;
}

function calcPts(i) {
  const player = D.players[i];
  const myTeams = player.teams.map(norm).filter(Boolean);
  if (!myTeams.length) return {total:0, gp:0, kp:0, notes:[]};

  let gp = 0, kp = 0;
  const notes = [];

  // Group stage — win:3, draw:1, loss:0  + bonuses
  let wins=0, draws=0, bigScore=0, cleanSheets=0, bigWins=0;
  for (const g of GROUPS) {
    const grp = D.groups[g];
    for (const m of grp.matches) {
      if (m.hs===''||m.hs==null||m.as===''||m.as==null) continue;
      const hs = +m.hs, as = +m.as;
      const hn = norm(grp.teams[m.h]);
      const an = norm(grp.teams[m.a]);

      if (myTeams.some(t => teamMatch(t, hn))) {
        if (hs > as)      { gp+=3; wins++;  }
        else if (hs===as) { gp+=1; draws++; }
        if (hs >= 3)           { gp+=1; bigScore++;    }
        if (as === 0)          { gp+=1; cleanSheets++; }
        if (hs-as >= 3)        { gp+=2; bigWins++;     }
      }
      if (myTeams.some(t => teamMatch(t, an))) {
        if (as > hs)      { gp+=3; wins++;  }
        else if (as===hs) { gp+=1; draws++; }
        if (as >= 3)           { gp+=1; bigScore++;    }
        if (hs === 0)          { gp+=1; cleanSheets++; }
        if (as-hs >= 3)        { gp+=2; bigWins++;     }
      }
    }
  }
  if (gp > 0) {
    let bk = `${wins}W ${draws}D`;
    if (bigScore)    bk += ` · ${bigScore}×3+goals(+1)`;
    if (cleanSheets) bk += ` · ${cleanSheets}×CS(+1)`;
    if (bigWins)     bk += ` · ${bigWins}×+3margin(+2)`;
    notes.push(`Groups ${gp}pts (${bk})`);
  }

  // Knockout rounds — flat points for reaching each round
  for (const r of ROUNDS) {
    const inRound = teamsInRound(r.key);
    let earned = 0;
    for (const t of myTeams) {
      if (inRound.has(t)) { earned += r.pts; continue; }
      for (const bt of inRound) if (teamMatch(t, bt)) { earned += r.pts; break; }
    }
    if (earned) { kp += earned; notes.push(`${r.label} +${earned}`); }
  }

  // Knockout per-match scoring — same bonuses as group stage
  let koMatchKp = 0, koWins = 0, koDraws = 0, koBig = 0, koCS = 0, koWin3 = 0;
  for (const r of ROUNDS) {
    for (const m of (D.ko[r.key]||[])) {
      const hs = String(m.hs ?? ''), as = String(m.as ?? '');
      if (hs === '' && as === '') continue;
      const hPen = /[Ee]/.test(hs), aPen = /[Ee]/.test(as);
      const hg = parseInt(hs) || 0, ag = parseInt(as) || 0;
      let hw, aw;
      if      (hPen)   { hw = 'w'; aw = 'l'; }
      else if (aPen)   { hw = 'l'; aw = 'w'; }
      else if (hg > ag){ hw = 'w'; aw = 'l'; }
      else if (ag > hg){ hw = 'l'; aw = 'w'; }
      else             { hw = 'd'; aw = 'd'; }
      const hn = norm(m.h), an = norm(m.a);

      if (myTeams.some(t => teamMatch(t, hn))) {
        if (hw === 'w')      { koMatchKp+=3; koWins++;  }
        else if (hw === 'd') { koMatchKp+=1; koDraws++; }
        if (hg >= 3)         { koMatchKp+=1; koBig++;   }
        if (ag === 0)        { koMatchKp+=1; koCS++;    }
        if (hg-ag >= 3)      { koMatchKp+=2; koWin3++;  }
      }
      if (myTeams.some(t => teamMatch(t, an))) {
        if (aw === 'w')      { koMatchKp+=3; koWins++;  }
        else if (aw === 'd') { koMatchKp+=1; koDraws++; }
        if (ag >= 3)         { koMatchKp+=1; koBig++;   }
        if (hg === 0)        { koMatchKp+=1; koCS++;    }
        if (ag-hg >= 3)      { koMatchKp+=2; koWin3++;  }
      }
    }
  }
  if (koMatchKp > 0) {
    let bk = `${koWins}W ${koDraws}D`;
    if (koBig)  bk += ` · ${koBig}×3+goals(+1)`;
    if (koCS)   bk += ` · ${koCS}×CS(+1)`;
    if (koWin3) bk += ` · ${koWin3}×+3margin(+2)`;
    notes.push(`KO matches ${koMatchKp}pts (${bk})`);
    kp += koMatchKp;
  }

  // Champion
  const champ = norm(D.ko.champion);
  if (champ && myTeams.some(t => teamMatch(t, champ))) { kp += 40; notes.push('Champion +40'); }

  return {total: gp+kp, gp, kp, notes};
}

// ─── VIEW MODE ────────────────────────────────────────────────────────────────

function applyViewMode() {
  document.body.classList.add('view-mode');
  // Disable all current inputs
  document.querySelectorAll('input').forEach(el => el.disabled = true);
  // Disable inputs added by future tab switches
  new MutationObserver(() => {
    document.querySelectorAll('input:not([disabled])').forEach(el => el.disabled = true);
  }).observe(document.querySelector('main'), {childList: true, subtree: true});
  // Land on leaderboard by default
  go('leaderboard');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────

function buildAll() {
  buildPlayers();
  buildGroups();
  buildBracket();
  buildLeaderboard();
}

loadFromServer().then(() => {
  buildAll();
  if (IS_EDIT) {
    const btns = document.getElementById('bar-btns');
    if (btns) {
      const syncBtn = document.createElement('button');
      syncBtn.id = 'sync-btn';
      syncBtn.className = 'btn';
      syncBtn.textContent = '↑ Sync cloud';
      syncBtn.onclick = syncNow;
      btns.insertBefore(syncBtn, btns.firstChild);
    }
  } else {
    applyViewMode();
    // Auto-refresh from Gist every 90s so view-only links stay live
    setInterval(async () => {
      await loadFromServer();
      const active = document.querySelector('.tab.on')?.textContent?.trim().toLowerCase() || 'leaderboard';
      buildAll();
      go(active);
    }, 90000);
  }
});
</script>
</body>
</html>
